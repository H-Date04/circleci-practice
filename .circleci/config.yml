{
  "version": 2.1,
  "jobs": {
  "build": {
  "docker": [
    {
    "image": "cimg/python:3.10-browsers"
    }
  ],
  "working_directory": "~/repo",
  "steps": [
    "checkout",
    {
    "run": {
    "name": "install dependencies",
    "command": "python3 -m venv venv && venv/bin/python -m pip install --upgrade pip && venv/bin/python -m pip install -r requirements.txt"
    }
    },
    {
    "run": "mkdir -p test-reports"
    },
    {
    "run": {
    "name": "run test",
    "command": "venv/bin/python -m pytest test_practiice2.py -v --junit-xml=test-results/regression/results.xml --html=test-reports/report.html --self-contained-html"
    }
    },
    {
    "store_artifacts": {
    "path": "test-reports/",
    "destination": "test-reports"
    }
    },
    {
    "store_test_results": {
    "path": "test-results"
    }
    }
  ]
  }
  },
  "workflows": {
  "version": 2,
  "normal_workflow": {
  "jobs": [
    "build"
  ]
  },
  "schedule_workflow": {
  "triggers": [
    {
    "schedule": {
    "cron": "30 * * * *",
    "filters": {
      "branches": {
      "only": [
      "main"
      ]
      }
    }
    }
    }
  ],
  "jobs": [
    "build"
  ]
  }
  }
}
